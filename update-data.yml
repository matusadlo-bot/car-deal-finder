name: Update finder data

on:
  schedule:
    - cron: '17 * * * *'      # hourly quick scan (UTC)
    - cron: '23 2 * * *'     # daily deep scan (UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: Scan mode
        required: true
        default: quick
        type: choice
        options:
          - quick
          - deep

permissions:
  contents: write

concurrency:
  group: car-deal-finder-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore scanner state
        shell: bash
        run: |
          set -e
          git fetch origin data:data-state || true
          if git show-ref --verify --quiet refs/heads/data-state; then
            if git show data-state:cars.db.gz > /tmp/cars.db.gz 2>/dev/null; then
              gzip -dc /tmp/cars.db.gz > cars.db
              echo "Restored cars.db from data branch"
            fi
            git branch -D data-state || true
          else
            echo "No previous data branch yet; starting with an empty database"
          fi

      - name: Choose scan mode
        id: mode
        shell: bash
        run: |
          MODE="quick"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          if [ "${{ github.event.schedule }}" = "23 2 * * *" ]; then MODE="deep"; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running $MODE scan"

      - name: Run scanners
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AI_ANALYSIS_MODE: ${{ secrets.AI_ANALYSIS_MODE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MOBILE_DE_USERNAME: ${{ secrets.MOBILE_DE_USERNAME }}
          MOBILE_DE_PASSWORD: ${{ secrets.MOBILE_DE_PASSWORD }}
        run: python cloud_scan.py "${{ steps.mode.outputs.mode }}"

      - name: Build website data
        run: python export_web.py

      - name: Publish fresh website data on main
        shell: bash
        run: |
          git config user.name "car-deal-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/results.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh finder results"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          else
            echo "No website-data changes"
          fi

      - name: Save scanner state on compact data branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gzip -c cars.db > /tmp/cars.db.gz
          cp last_cloud_scan.json /tmp/last_cloud_scan.json || true

          git checkout --orphan __data_tmp
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp /tmp/cars.db.gz cars.db.gz
          cp /tmp/last_cloud_scan.json last_cloud_scan.json 2>/dev/null || true
          printf '%s\n' "updated=$(date -u +%FT%TZ)" > state_info.txt
          git add cars.db.gz last_cloud_scan.json state_info.txt 2>/dev/null || git add cars.db.gz state_info.txt
          git commit -m "state: latest scanner database"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data --force
